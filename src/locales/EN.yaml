who:
  title: What I do?

  text1: >-
    Extensive experience administering Kubernetes, OpenShift, and Linux
    environments. Specializing in infrastructure as code management and
    automation (CI/CD, IaC, CCA), with a deep understanding of Kubernetes
    functionality, which has allowed me to identify and resolve infrastructure
    issues, successfully bringing projects to production.

  text2: >-
    I have solid knowledge of Linux system administration and automation,
    especially in Red Hat environments, using tools such as Ansible, Python,
    Shell Script, and Terraform for cloud environments. I adopt a GitOps
    approach and promote declarative infrastructure, aligned with Kubernetes
    principles.

  text3: >-
    In addition, I have experience as a web developer, which has allowed me to
    hone my skills in Git, programming, and CI/CD (Gitlab, Jenkins, Azure
    DevOps, etc.), facilitating the adoption of the "everything as code"
    approach.

  text4: >-
    Currently, I'm focused on expanding my skills in Site Reliability
    Engineering (SRE), DevOps, and Platform Engineering across on-premise,
    hybrid, and public cloud environments. My goal is to drive automation,
    resilience, and operational efficiency, always with a collaborative
    approach to problem-solving and continuous IT improvement.

  text5: ''

