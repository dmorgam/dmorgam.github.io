index:
  card:
    title: David Moreno Gámez
    subtitle: >-
      AI Platform Engineer
    text: >-
      AI Platform Engineer with a solid foundation in Kubernetes, Red Hat
      OpenShift, and Linux in enterprise environments. I design and build
      platforms where AI agents operate over real infrastructure, with the
      reliability and practices of classic Platform Engineering.
who:
  title: What I do?

  text1: >-
    My background combines strong expertise in automation and Infrastructure as
    Code with backend software development focused on applied AI. I regularly
    work with Python, FastAPI, Ansible, Terraform, GitLab CI, Jenkins, and Azure
    DevOps to standardize deployments, reduce operational overhead, and promote
    declarative, GitOps-driven infrastructure.

  text2: >-
   I still operate Kubernetes and OpenShift daily: internals, operators, CRDs
   and diagnosing complex production issues. The agent layer doesn't replace
   that foundation, it builds on it.

  text3: >-
    I currently design and develop a multi-agent AIOps platform, already in
    production, composed of microservices: an orchestrator that delegates to
    specialist agents, conversational and unattended, connected to a unified
    catalog of hundreds of tools via MCP, with guardrails, human approval and
    a governance layer that authorizes every agent action.

  text4: >-
    This includes backend components in Python and FastAPI, LLM agents with
    guardrails enforced in code, Retrieval-Augmented Generation (RAG) systems
    over vector databases, asynchronous processing based on webhooks and
    queues, and OAuth integrations with enterprise collaboration platforms.

  text5: >-
    I see myself as a T-shaped engineer, with depth in Platform Engineering and
    applied AI, and the ability to move comfortably between infrastructure,
    development, and operations. My focus is on building reliable, automated,
    and well-integrated platforms where modern engineering practices meet
    AI-driven capabilities serving operational workflows.


