index:
  card:
    title: David Moreno Gámez
    subtitle: >-
      AI Platform Engineer
    text: >-
      AI Platform Engineer con sólida base en Kubernetes, Red Hat OpenShift y
      Linux en entornos empresariales. Diseño y construyo plataformas donde
      agentes de IA operan sobre infraestructura real, con la fiabilidad y
      las prácticas del Platform Engineering clásico.
who:
  title: ¿A qué me dedico?

  text1: >-
    Mi trayectoria combina una fuerte experiencia en automatización e
    Infraestructura como Código con desarrollo de software backend orientado a
    IA aplicada. Trabajo habitualmente con Python, FastAPI, Ansible, Terraform,
    GitLab CI, Jenkins y Azure DevOps para estandarizar despliegues, reducir
    carga operativa y promover infraestructura declarativa orientada a GitOps.

  text2: >-
    Sigo operando Kubernetes y OpenShift a diario: internals, operators, CRDs
    y diagnóstico de problemas complejos en producción. La capa de agentes no
    sustituye esa base, se apoya en ella.

  text3: >-
    Actualmente diseño y desarrollo una plataforma AIOps agéntica compuesta
    por microservicios: agentes conversacionales y desatendidos conectados a
    un catálogo unificado de tools vía MCP, con guardrails y una capa de
    gobierno que controla las acciones de los agentes.

  text4: >-
   Esto incluye componentes backend en Python y FastAPI, agentes LLM con
   guardrails aplicados en código, sistemas de Retrieval-Augmented Generation
   (RAG) sobre bases de datos vectoriales, procesado asíncrono basado en
   webhooks y colas, e integraciones OAuth con plataformas de colaboración
   corporativas.

  text5: >-
    Me defino como un perfil T-shaped, con profundidad en Platform Engineering
    e IA aplicada, y capacidad para moverme con soltura entre infraestructura,
    desarrollo y operación. Mi foco está en construir plataformas fiables,
    automatizadas y bien integradas, donde las prácticas modernas de ingeniería
    se combinan con capacidades de IA al servicio de los flujos operativos.

