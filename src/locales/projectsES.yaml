---

aiops_platform:
  title: >-
    Plataforma AIOps agéntica multiagente, arquitectura de microservicios -
    2025/26 - LOGICALIS
  text1: >-
    Diseño y desarrollo de una plataforma AIOps multiagente en producción,
    compuesta por microservicios desacoplados: un orquestador que delega en
    agentes especialistas, una pasarela unificada de tools (MCP Hub), ingesta
    de eventos por webhooks y una capa de gobierno de acciones con aprobación
    humana.

  text2: >-
    Los agentes operan sobre sistemas corporativos (Kubernetes, virtualización,
    red y seguridad, ITSM, directorio, cloud y documentación interna) a través
    de un catálogo común de ~400 tools de 18 servidores MCP, propios y de
    fabricante, con selección semántica y de forma controlada y auditable.

  text3: >-
    Ecosistema cloud native de extremo a extremo: FastAPI, despliegue en
    Kubernetes con Helm y GitOps (Argo CD, External Secrets), infraestructura
    con Terraform y CI/CD en Azure DevOps con versionado semántico.
    Multi-tenant, agnóstica al proveedor de modelos (Azure OpenAI, AWS
    Bedrock) y extensible por configuración, sin tocar código.

  text4: >-
    Preparada para varios modelos de despliegue: SaaS, dedicada en la nube del
    cliente, sobre su propia plataforma Kubernetes o con una extensión
    on-premise (k3s) para integrar herramientas locales. Observabilidad
    end-to-end con OpenTelemetry y registro de auditoría alineado con ISO/IEC
    42001, en fase de implantación.

agents_logicalis:
  title: >-
    Sistema multiagente: orquestador y agentes especialistas con guardrails -
    2026 - LOGICALIS
  text1: >-
    Orquestador sobre LangGraph con dos estrategias: ReAct para consultas
    sencillas y plan-execute para las complejas (planificación con salida
    estructurada, subtareas en paralelo, replanificación y síntesis). Sirve
    chat en streaming (SSE) a Microsoft Teams y a una interfaz web, y
    ejecuciones desatendidas disparadas por eventos de infraestructura.

  text2: >-
    Cada subtarea se delega en agentes especialistas que corren como servicio
    propio, cada uno con su rol, su prompt, su modelo y un scope acotado de
    tools. Se registran en caliente mediante un CRD y un operator de
    Kubernetes, sin reiniciar el orquestador.

  text3: >-
    Guardrails en código, no en prompt: listas de permitido/denegado de tools,
    modo dry-run, timeouts por tool y por ejecución, presupuesto de tiempo,
    tools obligatorias y auditoría estructurada de cada run. Trazabilidad
    end-to-end con un identificador por ejecución y subtarea que atraviesa
    todos los servicios.

policy_logicalis:
  title: >-
    Gobierno de acciones de agentes IA, Policy Enforcement - 2026 - LOGICALIS
  text1: >-
    Servicio de decisión de políticas (PDP) que autoriza cada llamada a tool
    de los agentes antes de ejecutarse, con diseño fail-closed: ante error o
    duda, deniega.

  text2: >-
    Pipeline de cuatro capas: autorización determinista RBAC (Casbin) de
    usuario y agente con mínimo privilegio, validación de argumentos contra el
    schema de cada tool, supervisión humana (human-in-the-loop) que retiene
    las acciones sensibles hasta que las aprueba desde el chat la persona que
    las pidió, y un LLM judge que evalúa riesgos (exfiltración, inyección,
    acciones inseguras) y puede escalar a una persona, pero nunca relajar una
    decisión.

  text3: >-
    Cada decisión queda registrada con su motivo, las capas que la tomaron y
    un identificador de auditoría. Permite que agentes autónomos operen sobre
    infraestructura real dentro de límites verificables y auditables.

hub_logicalis:
  title: >-
    MCP HUB, proxy de MCPs y búsqueda semántica de tools y documentación -
    2026 - LOGICALIS
  text1: >-
    Gateway que unifica cientos de tools de servidores MCP remotos (~400 de 18
    servidores), documentación operativa y memoria conversacional en un único
    MCP, proporcionando al modelo un único punto de entrada.

  text2: >-
    En lugar de exponer cientos de tools al LLM, indexa todo el catálogo en una
    base de datos vectorial (Milvus) y aplica RAG semántico. El cliente MCP
    solo ve 4 tools (descubrir tools, ejecutar tools, consultar docs e
    historial de conversación) y recibe únicamente lo relevante en cada paso.
    Los MCPs remotos se registran en caliente, incluso en modo self-service
    vía CRDs y un operator de Kubernetes.

  text3: >-
    Multi-tenant por diseño, con scopes por rol que limitan qué tools y
    documentos ve cada agente. Actúa como punto de aplicación de políticas:
    consulta al PDP antes de cada ejecución y retiene las acciones pendientes
    de aprobación humana. Despliegue cloud native en Kubernetes. Orquesta
    tooling heterogéneo con un coste mínimo de contexto.

hooks_logicalis:
  title: Orquestador IA WebHooks, acciones automatizadas - 2026 - LOGICALIS
  text1: >-
    La aplicación recibe eventos vía webhooks y los procesa asíncronamente en
    una cola de Redis con ventana de espera, deduplicación y cancelación de
    eventos (por ejemplo si la alerta se resuelve sola antes de actuar).

  text2: >-
    Cada evento vencido dispara la ejecución de un agente de IA conectado a
    MCP, que ejecuta las acciones requeridas según el prompt configurado y
    bajo guardrails.

  text3: >-
    Diseño extensible y agnóstico al dominio. Adaptable a casos de uso diversos
    mediante configuración declarativa. La app está containerizada y lista para
    usar en entornos cloud native como kubernetes.

rhel-sgad:
  title: Administración de Red Hat Enterprise Linux - 2022,2023 - SGAD
  text1: >-
    Configuración de servidores Rhel, configuración del sistema (firewalld,
    iptables, packages, NetworkManager, Grub, etc..).

  text2: >-
    Configuración de demonios cliente como el de Red Hat Satellite, CheckMK

  text3: >-
    Configuración de servidores y servidores de aplicaciones como Tomcat,
    WebLogic, PHP fpm, Apache, Nginx.

docker-sgad:
  title: Gestión de entornos containerizados - 2022,2023 - SGAD
  text1: >-
    Containerización de aplicaciones internas (algunas mantenidas por mí) para
    habilitar el despliegue en entornos containerizados.

  text2: >-
    Mantenimiento de diferentes Docker Stacks (Swarm,compose), arreglando
    entornos.

  text3: >-
    Construcción de contenedores auxiliares para ayudar a los despliegues de
    diferentes proyectos.

ocp_logicalis:
  title: Administración Openshift y Kubernetes - 2024/25 - LOGICALIS
  text1: >-
    Administración, actualizaciones, operadores, ciclo de vida y CI/CD.

  text2: >-
    Responsable de la gestión, automatización y soporte de infraestructuras
    openshift y k8s en cloud y on-premise en entornos empresariales. Trabajo
    orientado a garantizar la disponibilidad, escalabilidad y eficiencia de
    plataformas híbridas mediante herramientas modernas de infraestructura como
    código, observabilidad, CI/CD y GitOps.

  text3: >-
    Configuración de operadores y gestión del ciclo de vida.


tanzu:
  title: Administración de clústeres Kubernetes de VMware Tanzu - 2023 - SGAD
  text1: >-
    Administración de VMware Tanzu kubernetes clúster, aprovisionamiento de
    clústeres, namespaces, policies etc...

  text2: >-
    Despliegue de aplicaciones en los clústeres, usando yamls en crudo y
    herramientas de templating como HELM.

  text3: Configuración de Operadores y plugins dentro de los clústeres.

ansible:
  title: Desarrollo Playbooks en Ansible - 2022,2023 - SGAD
  text1: >-
    Desarrollo/Mejora de playbooks de Ansible para la configuración automatizada
    de servidores RedHat Enterprise Linux.

  text2: >-
    Configuración de parámetros de red, sistema, selinux, paquetería de RedHat
    Satellite, Servidores Web como Apache, servidores de Aplicaciones como
    Tomcat o Weblogic.

cdtools:
  title: >-
    Herramientas apoyo a CD y despliegue infraestructura virtualizada
    - 2022,2023 - SGAD

  text1: >-
    Desarrollo/Mejora de herramientas en Flask y Python para apoyar el proceso
    de despliegue continuo, aportando automatismos e interfaces gráficas para
    mejorar el uso.

  text2: >-
    Desarrollo de scripts para Automatizar la configuración de infraestructura
    virtualizada en máquinas RHEL.

automation_logicalis:
  title: Iniciativa de automatización multi equipo - 2025 - LOGICALIS
  text1: Desarrollo de automatismos en varios lenguajes para varios equipos
  text2: >-
    Desarrollo de automatismos en python, ansible, powershell además de con
    tools de despliegues como Azure DevOps, GitHub actions, Helm Charts.
    Desarrollos para varios equipos (devops, wintel, bbdd, linux, backup).

terraform_rosa:
  title: Despliegue de ROSA HCP con varias features - 2025 - LOGICALIS
  text1: Desarrollo de código terraform con workspaces y multistage.
  text2: >-
    Automatización IAC de ROSA HCP en terraform con subdivision de varios
    módulos, workspaces por cada entorno, y generación de roles, quotas,
    elbs y demás necesarios. Parametrizado y extrapolable a diferentes
    entornos y clientes.

terraform:
  title: Despliegue de infraestructura con Terraform - 2023 - SGAD
  text1: Desarrollo de infraestructura como código en Terraform.
  text2: >-
    Despliegue con Terraform de clústeres de Kubernetes en VMware Tanzu, a
    través de la api de VMware mission control.

caceres:
  title: Web Comercial Caceres - 2021
  text1: >-
    Página web creada con laravel, Vue js y DB mysql. Es una tienda web que
    carga todos los productos y maneja la galería con componentes de Vue y las
    API AJAX en laravel, asegurando una experiencia fluida. Todo enlazado con el
    sqlserver del ERP de la empresa.

  text2: >-
    Además, dispone de varias webapps internas para la gestión de bodega, stock
    y un sistema de gestión de reservas personalizado con exportación a excel,
    pdf y generación de reportes.

  text3: Ir a la Web

caceresLegacy:
  title: Antigua Web Comercial Caceres (Mejoras) - 2020 - Comercial Caceres
  text1: >-
    Web creada con php, js y DB mysql. Contribución mejorando la web y añadiendo
    módulos.

  text2: >-
    Generación de hojas de ruta en pdf, trazado de rutas con la API de google
    maps, sistemas de gestión de permisos, gestión de reservas y estadísticas de
    venta de los productos.

  text3: Catálogo automatizado conectado al ERP.

  text4: Generación de reportes en pdf con FPDF y hojas excel con PHPexcel.

  text5: Ir a la Web

mayorista:
  title: Aplicación de Venta mayorista en terreno - 2021 - Comercial Caceres
  text1: >-
    Aplicación de gestión de ventas mayoristas, hecha en vue.js y con la api
    ajax en laravel.

  text2: >-
    Gestiona pedidos y clientes, deudas de clientes, dispone de un catalogo con
    los últimos precios y stock real con imágenes para la venta directa en
    terreno.

  text3: >-
    Para la comunicación entre la app y el backend, se usa la libreria axios
    haciendo peticiones get, post y put para obtener los datos, ingresar nuevos
    y actualizar.

  text4: >-
    El front dispone de varios componentes los cuales se van alternando cargando
    dinamicamente según el modo en el que esté (estado inicial o cliente
    cargado).

colacion:
  title: >-
    Aplicación de Gestión de horarios de colación - 2020 - Comercial Caceres
  text1: >-
    Aplicación para administrar el tiempo de colación de los trabajadores con
    temporizador, ticket de colación y registro de colaciones por cada
    trabajador.

  text2: >-
    El servidor en PHP y DB mysql dispone de una api a la que se conectan los
    front cliente web y la aplicación android.

  text3: >-
    El front web dispone de la pantalla de colación y el formulario que
    registra las entradas y salidas de trabajadores. El apk android consta de
    controles con los cuales, los jefes de tienda pueden ver quien está en
    colación y liberar los asientos.

afiche:
  title: Afiche publicitario automático - 2020 - Comercial Caceres
  text1: >-
    El afiche consiste en una pantalla en html y js recibiendo mediante AJAX
    la lista de productos a mostrar, y los descarga de la DB del ERP para
    mostrarlos.

  text2: >-
    El backend en php dispone de un endpoint donde muestra los productos en
    lista, también dispone de varias categorías para poder mostrar afiches de
    distinto tipo.

  text3: >-
    Dispone de una interfaz de gestión de los productos en cada categoría para
    gestionar los productos mostrados.

  text4: Ir a la Web

personal:
  title: Web personal en mi VPS - 2021 - Personal
  text1: >-
    En esta web se presentan los proyectos principales que he llevado a cabo
    y una muestra de mis habilidades en forma de widgets y pequeños proyectos
