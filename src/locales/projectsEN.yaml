---

aiops_platform:
  title: >-
    Multi-agent agentic AIOps platform, microservices architecture - 2025/26 -
    LOGICALIS
  text1: >-
    Design and development of a multi-agent AIOps platform running in
    production, composed of decoupled microservices: an orchestrator that
    delegates to specialist agents, a unified tool gateway (MCP Hub), webhook
    event ingestion and an action governance layer with human approval.

  text2: >-
    Agents operate over corporate systems (Kubernetes, virtualization,
    networking and security, ITSM, directory, cloud and internal
    documentation) through a shared catalog of ~400 tools from 18 MCP servers,
    both in-house and vendor-provided, with semantic selection, in a
    controlled and auditable way.

  text3: >-
    End-to-end cloud native ecosystem: FastAPI, Kubernetes deployments with
    Helm and GitOps (Argo CD, External Secrets), infrastructure with Terraform
    and CI/CD on Azure DevOps with semantic versioning. Multi-tenant,
    model-provider agnostic (Azure OpenAI, AWS Bedrock) and extensible through
    configuration, without touching code.

  text4: >-
    Built for several deployment models: SaaS, dedicated in the customer's
    cloud, on top of the customer's own Kubernetes platform, or with an
    on-premise extension (k3s) to integrate local tools. End-to-end
    observability with OpenTelemetry and an audit trail aligned with ISO/IEC
    42001, currently being rolled out.

agents_logicalis:
  title: >-
    Multi-agent system: orchestrator and specialist agents with guardrails -
    2026 - LOGICALIS
  text1: >-
    LangGraph-based orchestrator with two strategies: ReAct for simple
    requests and plan-execute for complex ones (planning with structured
    output, parallel subtasks, replanning and synthesis). It serves streaming
    chat (SSE) to Microsoft Teams and a web UI, and unattended runs triggered
    by infrastructure events.

  text2: >-
    Each subtask is delegated to specialist agents running as their own
    service, each with its own role, prompt, model and a narrow tool scope.
    They register at runtime through a CRD and a Kubernetes operator, without
    restarting the orchestrator.

  text3: >-
    Guardrails enforced in code, not in the prompt: tool allow/deny lists,
    dry-run mode, per-tool and per-run timeouts, time budgets, required tools
    and structured auditing of every run. End-to-end traceability through a
    per-run and per-subtask identifier that travels across every service.

policy_logicalis:
  title: >-
    Action governance for AI agents, Policy Enforcement - 2026 - LOGICALIS
  text1: >-
    Policy Decision Point (PDP) service that authorizes every agent tool call
    before it executes, with a fail-closed design: on error or doubt, deny.

  text2: >-
    Four-layer pipeline: deterministic RBAC (Casbin) for both user and agent
    with least privilege, argument validation against each tool's schema,
    human-in-the-loop supervision that holds sensitive actions until the
    person who requested them approves them from the chat, and an LLM judge
    that evaluates risks (exfiltration, injection, unsafe actions) and can
    escalate to a human, but never relax a decision.

  text3: >-
    Every decision is recorded with its reason, the layers that made it and an
    audit identifier. Lets autonomous agents operate over real infrastructure
    within verifiable, auditable limits.

hub_logicalis:
  title: >-
    MCP HUB, MCP proxy and semantic search of tools and documentation - 2026
    - LOGICALIS
  text1: >-
    Gateway that unifies hundreds of tools from remote MCP servers (~400 from
    18 servers), operational documentation and conversational memory into a
    single MCP, providing the model with a single entry point.

  text2: >-
    Instead of exposing hundreds of tools to the LLM, it indexes the entire
    catalog in a vector database (Milvus) and applies semantic RAG. The MCP
    client only sees 4 tools (discover tools, execute tools, query docs and
    conversation history) and receives only what is relevant at each step.
    Remote MCPs register at runtime, including self-service via CRDs and a
    Kubernetes operator.

  text3: >-
    Multi-tenant by design, with per-role scopes that limit which tools and
    documents each agent can see. It acts as the policy enforcement point:
    it asks the PDP before every execution and holds actions pending human
    approval. Cloud native deployment on Kubernetes. It orchestrates
    heterogeneous tooling with minimal context cost.

hooks_logicalis:
  title: AI WebHooks Orchestrator, automated actions - 2026 - LOGICALIS
  text1: >-
    The application receives events via webhooks and processes them
    asynchronously in a Redis queue with a delay window, deduplication and
    event cancellation (for instance when an alert resolves itself before
    action is taken).

  text2: >-
    Each due event triggers the run of an AI agent connected to MCP, which
    executes the required actions based on the configured prompt and under
    guardrails.

  text3: >-
    Extensible and domain-agnostic design. Adaptable to diverse use cases
    through declarative configuration. The app is containerized and ready to
    run in cloud native environments like kubernetes.

